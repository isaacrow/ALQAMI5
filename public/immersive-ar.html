<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#cbc9c5" />
    <title>Artifact AR Preview</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; color: #211f1b; background: #cbc9c5; font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom)); }
      header { display: flex; align-items: center; gap: 12px; max-width: 760px; width: 100%; margin: 0 auto; }
      h1 { margin: 0; font-size: 18px; line-height: 1.25; }
      .back { border: 0; border-radius: 50%; background: #fff9; width: 42px; height: 42px; font-size: 22px; }
      model-viewer { width: min(100%, 760px); height: min(72dvh, 760px); min-height: 320px; margin: auto; --poster-color: transparent; }
      .ar-button { position: fixed; left: 50%; bottom: max(28px, env(safe-area-inset-bottom)); transform: translateX(-50%); border: 0; border-radius: 999px; padding: 14px 22px; background: #ffd60a; color: #141414; font-size: 16px; font-weight: 700; box-shadow: 0 8px 28px #0003; white-space: nowrap; }
      .hint { max-width: 480px; width: 100%; margin: 0 auto; text-align: center; color: #514d46; font-size: 13px; padding-bottom: 8px; }
      .error { display: none; color: #8f1d1d; text-align: center; padding: 16px; }
    </style>
    <script type="module" src="./js/model-viewer.min.js"></script>
  </head>
  <body>
    <main>
      <header>
        <button class="back" type="button" aria-label="Go back" onclick="history.back()">‹</button>
        <h1 id="title">Artifact AR Preview</h1>
      </header>
      <model-viewer id="artifact" camera-controls auto-rotate ar ar-modes="quick-look" shadow-intensity="1" exposure="1" interaction-prompt="none" loading="eager">
        <button slot="ar-button" class="ar-button" type="button">⌖ &nbsp; View in your space</button>
      </model-viewer>
      <div>
        <p class="hint">Move your iPhone to place the artifact in the room. Drag the model to rotate it.</p>
        <p id="error" class="error">This artifact could not be loaded. Return to the catalog and try again.</p>
      </div>
    </main>
    <script>
      const query = new URLSearchParams(location.search);
      const source = query.get('model');
      const title = query.get('title') || 'Artifact AR Preview';
      document.title = title + ' · AR Preview';
      document.getElementById('title').textContent = title;
      const viewer = document.getElementById('artifact');
      if (source && /^(https?:|\/|\.\/)/.test(source)) {
        viewer.src = source;
        viewer.alt = title;
        viewer.addEventListener('error', () => { document.getElementById('error').style.display = 'block'; });
      } else {
        document.getElementById('error').style.display = 'block';
      }
    </script>
  </body>
</html>
